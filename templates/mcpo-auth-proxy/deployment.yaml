{{- if and .Values.mcpo.enabled .Values.mcpo.authProxy.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{  .Release.Namespace }}
  name: {{ include "supabase.mcpo-auth-proxy.fullname" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "supabase.mcpo-auth-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "supabase.mcpo-auth-proxy.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: auth-proxy
          image: "node:20-alpine"
          command: ["node", "/proxy/proxy.js"]
          env:
            {{- if .Values.secret.jwt.secretRef }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.jwt.secretRef }}
                  key: {{ .Values.secret.jwt.secretRefKey.secret | default "secret" }}
            {{- end }}
            {{- if .Values.mcpo.apiAuth.secretRef }}
            - name: MCPO_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mcpo.apiAuth.secretRef }}
                  key: {{ .Values.mcpo.apiAuth.secretKey }}
            {{- end }}
            - name: MCPO_URL
              value: {{ printf "http://%s:%v" (include "supabase.mcpo.fullname" .) .Values.mcpo.service.port | quote }}
            - name: PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: proxy
              mountPath: /proxy
              readOnly: true
          {{- with .Values.mcpo.authProxy.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: proxy
          configMap:
            name: {{ include "supabase.mcpo-auth-proxy.fullname" . }}
      {{- with .Values.mcpo.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpo.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
