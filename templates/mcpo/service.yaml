{{- if .Values.mcpo.enabled -}}
apiVersion: v1
kind: Service
metadata:
  namespace: {{  .Release.Namespace }}
  name: {{ include "supabase.mcpo.fullname" . }}
  labels:
    {{- include "supabase.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mcpo.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "supabase.mcpo.selectorLabels" . | nindent 4 }}
{{- end }}
